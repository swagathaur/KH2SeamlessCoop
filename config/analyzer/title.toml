# PS2Recomp configuration for: title.elf
# Generated by ElfAnalyzer

[general]
# Path to input ELF file
input = "build\\overlays\\title.elf"

# Path to Ghidra exported function map (optional CSV)
ghidra_output = ""

# Path to output directory
output = "build/analyzer/output/"

# Single file output mode (recommended for large games)
single_file_output = false

# Patch policy (instruction-driven handling is preferred for syscalls)
patch_syscalls = false
patch_cop0 = true
patch_cache = true

# Functions to stub (only names with runtime syscall/stub handlers)
stubs = [
]

# Detected library-like functions without runtime handlers.
# This is informational only; PS2Recomp ignores this list and recompiles them normally.
untracked_stubs = [
]

# Legacy compatibility field. The analyzer no longer auto-populates skip entries.
skip = []

# Patches to apply during recompilation
[patches]
# Individual instruction patches
instructions = [
  { address = "0x1f18188", value = "0x0" },  # Potential self-modifying code
  { address = "0x1f18cc8", value = "0x0" },  # Potential self-modifying code
]

# Performance critical functions (may need manual optimization)
[performance]
critical = [
  "sub_01F18218", # Contains heavy loops
  "sub_01F18A48", # Contains heavy loops
  "sub_01F18E08", # Contains heavy loops
  "sub_01F197D0", # Contains heavy loops
  "sub_01F1B018", # Contains heavy loops
  "sub_01F1B580", # Contains heavy loops
  "sub_01F1C258", # Contains heavy loops
  "sub_01F1D220", # Contains heavy loops
  "sub_01F1F318", # Uses SIMD instructions
]

